name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: |
            DATABASE_URL
          script: |
            cd /var/www/beauty-specialist

            # Fix permissions
            sudo chown -R deploy:deploy /var/www/beauty-specialist 2>/dev/null || true
            sudo chmod -R u+rw /var/www/beauty-specialist 2>/dev/null || true

            git config --global --add safe.directory /var/www/beauty-specialist
            git pull origin main
            git reset --hard HEAD

            export DATABASE_URL="${DATABASE_URL}"

            bash deploy_setup.sh

            # Backend
            cd online-booking/backend
            python3.12 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt

            echo "=== ALEMBIC ==="
            alembic upgrade head
            echo "=== ALEMBIC DONE ==="

            echo "=== SUPERUSER ==="
            python3.12 create_superuser.py
            echo "=== SUPERUSER DONE ==="

            echo "=== FIX DB ==="
            python3.12 fix_production_db.py
            echo "=== FIX DB DONE ==="

            echo "=== SEED ==="
            python3.12 seed_production.py
            echo "=== SEED DONE ==="

            echo "=== MINIMAL REVIEWS ==="
            python3.12 create_minimal_reviews.py
            echo "=== MINIMAL REVIEWS DONE ==="

            # Frontend
            cd ../frontend
            npm ci
            npm run build
            sudo cp -r dist/* /var/www/beauty-specialist/frontend/dist/

            # Restart
            sudo systemctl restart beauty-backend
            sudo systemctl restart nginx
            sleep 2

            echo "=== HEALTH ==="
            curl -s http://127.0.0.1:8000/health
            echo ""
            echo "=== COUNTRIES ==="
            curl -s http://127.0.0.1:8000/api/v1/countries/ | head -c 200
            echo ""
