name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd online-booking/backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite

      - name: Run tests
        run: |
          cd online-booking/backend
          PYTHONPATH=. pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --tb=no 2>&1 | tee test-results.txt
          echo ""
          echo "=== TEST SUMMARY ==="
          # Only match the final summary line: "X passed, Y failed, ..."
          grep -E "^[=]+.*passed.*failed" test-results.txt | tail -1 || \
          grep "passed.*in" test-results.txt | tail -1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: |
            DATABASE_URL
          script: |
            cd /var/www/beauty-specialist

            # Fix permissions
            sudo chown -R deploy:deploy /var/www/beauty-specialist 2>/dev/null || true
            sudo chmod -R u+rw /var/www/beauty-specialist 2>/dev/null || true

            git config --global --add safe.directory /var/www/beauty-specialist
            git pull origin main

            # Export DATABASE_URL for all subsequent commands
            export DATABASE_URL="${DATABASE_URL}"
            echo "DB: ${DATABASE_URL:0:30}..."

            # Backup database BEFORE any changes
            echo "=== DATABASE BACKUP ==="
            pg_dump "${DATABASE_URL}" > /tmp/db-backup-$(date +%Y%m%d-%H%M%S).sql 2>/dev/null || echo "[WARN] Backup skipped (pg_dump not available)"
            echo "=== BACKUP DONE ==="

            bash deploy_setup.sh

            # Backend
            cd online-booking/backend
            python3.12 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt

            # Run tests BEFORE deployment
            echo "=== RUNNING TESTS ==="
            pip install pytest pytest-asyncio pytest-cov httpx aiosqlite
            PYTHONPATH=. pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --tb=no 2>&1 | tee /tmp/test-results.txt
            
            # Check for actual test failures (not coverage report lines)
            if grep -qE "^[=]+.*failed" /tmp/test-results.txt || grep -qE "^[=]+.*error" /tmp/test-results.txt; then
                echo "ERROR: Tests failed on server! Aborting deployment."
                grep -E "failed|error" /tmp/test-results.txt | tail -5
                exit 1
            fi
            
            # Show summary
            TEST_SUMMARY=$(grep "passed.*in" /tmp/test-results.txt | tail -1)
            echo "Test summary: $TEST_SUMMARY"
            echo "=== ALL TESTS PASSED ==="

            # Fix schema mismatches BEFORE migrations (uses file in current directory)
            sudo -u postgres psql -d online_booking -f fix_all_tables.sql || echo "[WARN] Schema fix failed, continuing..."

            # Pass DATABASE_URL to each script
            echo "=== ALEMBIC ==="
            DATABASE_URL="${DATABASE_URL}" alembic upgrade head
            echo "=== ALEMBIC DONE ==="

            echo "=== SUPERUSER ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 create_superuser.py
            echo "=== SUPERUSER DONE ==="

            echo "=== FIX DB ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 fix_production_db.py
            echo "=== FIX DB DONE ==="

            echo "=== SEED ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 seed_production.py
            echo "=== SEED DONE ==="

            echo "=== MINIMAL REVIEWS ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 create_minimal_reviews.py
            echo "=== MINIMAL REVIEWS DONE ==="

            # Frontend
            cd ../frontend
            npm install
            npm run build
            sudo cp -r dist/* /var/www/beauty-specialist/frontend/dist/

            # Force nginx to not cache JS/CSS
            sudo bash -c 'echo "location ~* \.(js|css)$ { add_header Cache-Control \"no-cache, no-store, must-revalidate\"; add_header Pragma \"no-cache\"; add_header Expires \"0\"; }" >> /etc/nginx/sites-enabled/beauty-specialist'
            sudo systemctl reload nginx

            # Fix log directory permissions (service runs as www-data)
            sudo chown -R www-data:www-data /var/www/beauty-specialist/online-booking/backend/logs/
            sudo chmod -R 755 /var/www/beauty-specialist/online-booking/backend/logs/

            # Write nginx config with SSL (fixes broken configs from previous deploys)
            sudo bash -c 'cat > /etc/nginx/sites-enabled/beauty-specialist << NGINXEOF
server {
    listen 80;
    server_name beauty-specialist.ru www.beauty-specialist.ru;
    return 301 https://\$host\$request_uri;
}

server {
    listen 443 ssl http2;
    server_name beauty-specialist.ru www.beauty-specialist.ru;

    ssl_certificate /etc/letsencrypt/live/beauty-specialist.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beauty-specialist.ru/privkey.pem;

    root /var/www/beauty-specialist/frontend/dist;
    index index.html;

    location ~* \\.(js|css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files \$uri \$uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host \$host;
        proxy_set_header X-Real-IP \$remote_addr;
        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto \$scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host \$host;
    }
}
NGINXEOF'

            sudo nginx -t && sudo systemctl restart nginx

            # Restart
            sudo systemctl restart beauty-backend
            sudo systemctl restart nginx

            # Wait for backend
            sleep 5

            # Check backend
            echo "=== BACKEND CHECK ==="
            systemctl status beauty-backend --no-pager 2>&1 | head -10
            ss -tlnp | grep 8000 || echo "Port 8000 NOT listening"

            # Test API
            echo "=== API TEST ==="
            curl -sf http://127.0.0.1:8000/health || echo "HEALTH FAILED"
            curl -sf http://127.0.0.1:8000/api/v1/countries/ | head -c 200 || echo "COUNTRIES FAILED"
            
            # Test login (should return 401 not 500)
            LOGIN_RESULT=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/login-unified \
                -H 'Content-Type: application/json' \
                -d '{"identifier":"wrong@email.com","password":"wrong"}' 2>&1) || true
            if echo "$LOGIN_RESULT" | grep -q "401\|422\|Invalid"; then
                echo "LOGIN API works (returns 401 for wrong creds - OK)"
            elif echo "$LOGIN_RESULT" | grep -q "500\|Internal"; then
                echo "LOGIN API returns 500 - SCHEMA FIX FAILED!"
            else
                echo "LOGIN API response: $LOGIN_RESULT"
            fi
            
            # Test reviews (carousel data)
            REVIEWS=$(curl -sf http://127.0.0.1:8000/api/v1/reviews/ 2>&1) || true
            if echo "$REVIEWS" | grep -q '\['; then
                echo "REVIEWS API works: $(echo $REVIEWS | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))' 2>/dev/null || echo 'N/A') reviews"
            else
                echo "REVIEWS API FAILED: $REVIEWS"
            fi

            # Final health check — retry 3 times with 10s delay
            echo "=== FINAL HEALTH CHECK ==="
            HEALTH_OK=false
            for i in 1 2 3; do
                HEALTH_RESP=$(curl -sf http://127.0.0.1:8000/health 2>&1) || true
                if echo "$HEALTH_RESP" | grep -q '"status"'; then
                    HEALTH_OK=true
                    echo "Health check passed: $HEALTH_RESP"
                    break
                fi
                echo "Retry $i/3 — health check failed, waiting 10s..."
                sleep 10
            done

            if [ "$HEALTH_OK" = false ]; then
                echo "ERROR: Health check failed after 3 retries! Deployment may be unstable."
            else
                echo "=== DEPLOYMENT SUCCESSFUL ==="
            fi
