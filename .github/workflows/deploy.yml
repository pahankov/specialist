name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: |
            DATABASE_URL
          script: |
            cd /var/www/beauty-specialist

            # Fix permissions
            sudo chown -R deploy:deploy /var/www/beauty-specialist 2>/dev/null || true
            sudo chmod -R u+rw /var/www/beauty-specialist 2>/dev/null || true

            git config --global --add safe.directory /var/www/beauty-specialist
            git pull origin main
            git reset --hard HEAD

            # Export DATABASE_URL for all subsequent commands
            export DATABASE_URL="${DATABASE_URL}"
            echo "DB: ${DATABASE_URL:0:30}..."

            bash deploy_setup.sh

            # Backend
            cd online-booking/backend
            python3.12 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt

            # Fix schema mismatches BEFORE migrations (uses file in current directory)
            sudo -u postgres psql -d online_booking -f fix_all_tables.sql || echo "[WARN] Schema fix failed, continuing..."

            # Pass DATABASE_URL to each script
            echo "=== ALEMBIC ==="
            DATABASE_URL="${DATABASE_URL}" alembic upgrade head
            echo "=== ALEMBIC DONE ==="

            echo "=== SUPERUSER ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 create_superuser.py
            echo "=== SUPERUSER DONE ==="

            echo "=== FIX DB ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 fix_production_db.py
            echo "=== FIX DB DONE ==="

            echo "=== SEED ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 seed_production.py
            echo "=== SEED DONE ==="

            echo "=== MINIMAL REVIEWS ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 create_minimal_reviews.py
            echo "=== MINIMAL REVIEWS DONE ==="

            # Frontend
            cd ../frontend
            npm ci
            npm run build
            sudo cp -r dist/* /var/www/beauty-specialist/frontend/dist/

            # Fix log directory permissions (service runs as www-data)
            sudo chown -R www-data:www-data /var/www/beauty-specialist/online-booking/backend/logs/
            sudo chmod -R 755 /var/www/beauty-specialist/online-booking/backend/logs/

            # Restart
            sudo systemctl restart beauty-backend
            sudo systemctl restart nginx

            # Wait for backend
            sleep 5

            # Check backend
            echo "=== BACKEND CHECK ==="
            systemctl status beauty-backend --no-pager 2>&1 | head -10
            ss -tlnp | grep 8000 || echo "Port 8000 NOT listening"

            # Test API
            echo "=== API TEST ==="
            curl -sf http://127.0.0.1:8000/health || echo "HEALTH FAILED"
            curl -sf http://127.0.0.1:8000/api/v1/countries/ | head -c 200 || echo "COUNTRIES FAILED"
            
            # Test login (should return 401 not 500)
            LOGIN_RESULT=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/login-unified \
                -H 'Content-Type: application/json' \
                -d '{"identifier":"wrong@email.com","password":"wrong"}' 2>&1) || true
            if echo "$LOGIN_RESULT" | grep -q "401\|422\|Invalid"; then
                echo "LOGIN API works (returns 401 for wrong creds - OK)"
            elif echo "$LOGIN_RESULT" | grep -q "500\|Internal"; then
                echo "LOGIN API returns 500 - SCHEMA FIX FAILED!"
            else
                echo "LOGIN API response: $LOGIN_RESULT"
            fi
            
            # Test reviews (carousel data)
            REVIEWS=$(curl -sf http://127.0.0.1:8000/api/v1/reviews/ 2>&1) || true
            if echo "$REVIEWS" | grep -q '\['; then
                echo "REVIEWS API works: $(echo $REVIEWS | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))' 2>/dev/null || echo 'N/A') reviews"
            else
                echo "REVIEWS API FAILED: $REVIEWS"
            fi
