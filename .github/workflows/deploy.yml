name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd online-booking/backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite

      - name: Run tests
        run: |
          cd online-booking/backend
          PYTHONPATH=. pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --tb=no 2>&1 | tee test-results.txt
          echo ""
          echo "=== TEST SUMMARY ==="
          # Only match the final summary line: "X passed, Y failed, ..."
          grep -E "^[=]+.*passed.*failed" test-results.txt | tail -1 || \
          grep "passed.*in" test-results.txt | tail -1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: |
            DATABASE_URL
          script_stop: true
          timeout: 30m
          script: |
            cd /var/www/beauty-specialist

            # Fix permissions
            sudo chown -R deploy:deploy /var/www/beauty-specialist 2>/dev/null || true
            sudo chmod -R u+rw /var/www/beauty-specialist 2>/dev/null || true

            git config --global --add safe.directory /var/www/beauty-specialist
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Verify deployed commit
            echo "=== DEPLOYED COMMIT ==="
            git log -1 --oneline
            echo "=== EXPECTED COMMIT ==="
            echo "${{ github.sha }}"
            echo "========================"

            # Load DATABASE_URL from .env on server if env var is empty
            if [ -z "${DATABASE_URL}" ]; then
              echo "DATABASE_URL not set in env, reading from .env file..."
              if [ -f online-booking/backend/.env ]; then
                export $(grep -v '^#' online-booking/backend/.env | xargs)
                echo "Loaded from .env: ${DATABASE_URL:0:30}..."
              else
                echo "ERROR: DATABASE_URL is empty and no .env file found!"
                exit 1
              fi
            else
              echo "DB: ${DATABASE_URL:0:30}..."
            fi

            # Backup database BEFORE any changes
            echo "=== DATABASE BACKUP ==="
            pg_dump "${DATABASE_URL}" > /tmp/db-backup-$(date +%Y%m%d-%H%M%S).sql 2>/dev/null || echo "[WARN] Backup skipped (pg_dump not available)"
            echo "=== BACKUP DONE ==="

            # Ensure deploy scripts exist (may have Windows line endings)
            if [ ! -f deploy_setup.sh ]; then
                echo "ERROR: deploy_setup.sh not found!"
                ls -la
                exit 1
            fi
            sed -i 's/\r$//' deploy_setup.sh
            bash deploy_setup.sh

            # Backend
            cd online-booking/backend
            python3.12 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt

            # Run tests BEFORE deployment
            echo "=== RUNNING TESTS ==="
            pip install pytest pytest-asyncio pytest-cov httpx aiosqlite
            PYTHONPATH=. pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --tb=no 2>&1 | tee /tmp/test-results.txt
            
            # Check for actual test failures (not coverage report lines)
            if grep -qE "^[=]+.*failed" /tmp/test-results.txt || grep -qE "^[=]+.*error" /tmp/test-results.txt; then
                echo "ERROR: Tests failed on server! Aborting deployment."
                grep -E "failed|error" /tmp/test-results.txt | tail -5
                exit 1
            fi
            
            # Show summary
            TEST_SUMMARY=$(grep "passed.*in" /tmp/test-results.txt | tail -1)
            echo "Test summary: $TEST_SUMMARY"
            echo "=== ALL TESTS PASSED ==="

            # Fix schema mismatches BEFORE migrations (uses file in current directory)
            sudo -u postgres psql -d online_booking -f fix_all_tables.sql || echo "[WARN] Schema fix failed, continuing..."

            # Fix table ownership for audit_logs (created by postgres, migrations run as specialist)
            echo "=== FIX TABLE OWNERSHIP ==="
            sudo -u postgres psql -d online_booking -c "ALTER TABLE audit_logs OWNER TO specialist;" 2>/dev/null || echo "[WARN] Ownership fix skipped"
            echo "=== OWNERSHIP DONE ==="

            # Pass DATABASE_URL to each script
            echo "=== ALEMBIC ==="
            DATABASE_URL="${DATABASE_URL}" alembic upgrade head
            echo "=== ALEMBIC DONE ==="

            echo "=== SUPERUSER ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 create_superuser.py
            echo "=== SUPERUSER DONE ==="

            echo "=== FIX DB ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 fix_production_db.py
            echo "=== FIX DB DONE ==="

            echo "=== FIX MASTERS ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 fix_production_masters.py
            echo "=== FIX MASTERS DONE ==="

            echo "=== SEED ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 seed_production.py
            echo "=== SEED DONE ==="

            echo "=== MINIMAL REVIEWS ==="
            DATABASE_URL="${DATABASE_URL}" python3.12 create_minimal_reviews.py
            echo "=== MINIMAL REVIEWS DONE ==="

            # Frontend
            cd ../frontend
            echo "=== FRONTEND SOURCE CHECK ==="
            echo "Current commit:"
            git log -1 --oneline
            echo "DAData import in LoginModal:"
            grep -n "dadata" src/components/LoginModal.tsx || echo "NOT FOUND"
            echo "City autocomplete UI in LoginModal:"
            grep -n "city-dropdown" src/components/LoginModal.tsx || echo "NOT FOUND"
            echo "DAData API file exists:"
            ls -la src/api/dadata.ts || echo "NOT FOUND"
            echo "=============================="
            # Clean EVERYTHING to force complete rebuild
            echo "=== CLEANING BUILD CACHE ==="
            # Remove ALL possible Vite caches (local + global)
            rm -rf node_modules/.vite
            rm -rf .vite
            rm -rf dist
            rm -rf node_modules
            rm -rf ~/.cache/vite
            rm -rf ~/.vite
            rm -rf node_modules/.cache
            # Also remove any Vite cache in the project root
            rm -rf .vite-temp
            rm -rf .vite-deps
            npm cache clean --force
            echo "=== INSTALLING DEPENDENCIES ==="
            npm ci --no-audit --no-fund
            echo "=== CLEARING VITE DEPS CACHE (AFTER npm ci) ==="
            # Clear Vite's dependency pre-bundling cache AFTER npm ci
            # This is critical - npm ci reinstalls packages with same hashes,
            # so Vite thinks nothing changed and skips 167 modules
            rm -rf node_modules/.vite/deps
            rm -rf node_modules/.vite/deps-cache
            rm -rf node_modules/.vite
            echo "=== BUILDING FRONTEND ==="
            npm run build 2>&1 | tee /tmp/build-output.txt
            echo "=== BUILD OUTPUT ==="
            cat /tmp/build-output.txt
            
            # Get the JS file hash from built index.html
            BUILT_JS=$(grep -o 'assets/[^"]*\.js' dist/index.html | head -1 | sed 's|assets/||')
            echo "Built JS file: $BUILT_JS"
            
            # Check that we built a NEW file (not the old cached one)
            if [ "$BUILT_JS" = "index-DC34i42h.js" ]; then
                echo "ERROR: Built JS is the OLD cached file! Build did not update!"
                echo "This means Vite cache was not properly cleared."
                echo "Deleting dist and rebuilding..."
                rm -rf dist
                rm -rf node_modules/.vite
                rm -rf .vite
                npm cache clean --force
                npm run build 2>&1 | tee /tmp/build-output-2.txt
                BUILT_JS=$(grep -o 'assets/[^"]*\.js' dist/index.html | head -1 | sed 's|assets/||')
                echo "Rebuilt JS file: $BUILT_JS"
                if [ "$BUILT_JS" = "index-DC34i42h.js" ]; then
                    echo "ERROR: Still building old file after rebuild!"
                    exit 1
                fi
            fi
            echo "✓ Built a new JS file: $BUILT_JS"
            
            # Verify build contains new code (check BUILT JS, not source)
            echo "=== VERIFYING BUILD INTEGRITY ==="
            
            # List all JS files in dist/assets
            ls -la dist/assets/*.js 2>/dev/null || echo "No JS files found in dist/assets"
            
            # Check that built JS contains createPortal (new in this commit)
            if ! grep -q "createPortal" dist/assets/*.js 2>/dev/null; then
                echo "ERROR: Built JS missing createPortal! Build may be cached!"
                echo "Checking what's in the built JS..."
                grep -o "dadata" dist/assets/*.js 2>/dev/null || echo "dadata NOT FOUND"
                grep -o "createPortal" dist/assets/*.js 2>/dev/null || echo "createPortal NOT FOUND"
                exit 1
            fi
            echo "✓ Built JS contains createPortal (new code)"
            
            # Check that built JS does NOT contain citiesApi (old code)
            if grep -l "citiesApi" dist/assets/*.js 2>/dev/null; then
                echo "ERROR: Built JS still contains citiesApi! Build is stale!"
                exit 1
            fi
            echo "✓ Built JS does NOT contain citiesApi"
            
            # Copy with overwrite verification - remove entire dist first
            echo "=== COPYING FRONTEND TO DEPLOY DIRECTORY ==="
            rm -rf /var/www/beauty-specialist/frontend/dist
            mkdir -p /var/www/beauty-specialist/frontend/dist
            cp -r dist/* /var/www/beauty-specialist/frontend/dist/
            echo "Frontend files copied:"
            ls -la /var/www/beauty-specialist/frontend/dist/
            ls -la /var/www/beauty-specialist/frontend/dist/assets/
            
            # Verify copied JS file matches built JS
            COPIED_JS=$(grep -o 'assets/[^"]*\.js' /var/www/beauty-specialist/frontend/dist/index.html | head -1 | sed 's|assets/||')
            echo "Copied JS file: $COPIED_JS"
            if [ "$BUILT_JS" != "$COPIED_JS" ]; then
                echo "ERROR: JS file mismatch! Built: $BUILT_JS, Copied: $COPIED_JS"
                echo "Checking what's in the deploy directory..."
                ls -la /var/www/beauty-specialist/frontend/dist/
                ls -la /var/www/beauty-specialist/frontend/dist/assets/
                cat /var/www/beauty-specialist/frontend/dist/index.html | grep -o 'assets/[^"]*\.js'
                exit 1
            fi
            echo "✓ JS file hash matches: $COPIED_JS"
            
            # Final verification - check that the copied index.html is different from old version
            if [ "$COPIED_JS" = "index-DC34i42h.js" ]; then
                echo "ERROR: Copied JS is still the OLD file! Deployment failed!"
                exit 1
            fi
            echo "✓ Copied JS is NEW (not old cached version)"
            
            # Fix log directory permissions (service runs as www-data)
            sudo chown -R www-data:www-data /var/www/beauty-specialist/online-booking/backend/logs/
            sudo chmod -R 755 /var/www/beauty-specialist/online-booking/backend/logs/

            # Write nginx config with SSL (fixes broken configs from previous deploys)
            if [ ! -f /var/www/beauty-specialist/deploy_fix_nginx.sh ]; then
                echo "ERROR: deploy_fix_nginx.sh not found!"
                ls -la /var/www/beauty-specialist/
                exit 1
            fi
            sed -i 's/\r$//' /var/www/beauty-specialist/deploy_fix_nginx.sh
            bash /var/www/beauty-specialist/deploy_fix_nginx.sh

            # Restart
            sudo systemctl restart beauty-backend
            sudo systemctl restart nginx

            # Wait for backend
            sleep 5

            # Check backend
            echo "=== BACKEND CHECK ==="
            (systemctl status beauty-backend --no-pager 2>&1 | head -10) || true
            (ss -tlnp | grep 8000) || echo "Port 8000 NOT listening"

            # Test API
            echo "=== API TEST ==="
            curl -sf http://127.0.0.1:8000/health || echo "HEALTH FAILED"
            curl -sf http://127.0.0.1:8000/api/v1/countries/ > /dev/null && echo "[COUNTRIES OK]" || echo "COUNTRIES FAILED"
            
            # Test login (should return 401 not 500)
            LOGIN_RESULT=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/login-unified \
                -H 'Content-Type: application/json' \
                -d '{"identifier":"wrong@email.com","password":"wrong"}' 2>&1) || true
            if echo "$LOGIN_RESULT" | grep -q "401\|422\|Invalid"; then
                echo "LOGIN API works (returns 401 for wrong creds - OK)"
            elif echo "$LOGIN_RESULT" | grep -q "500\|Internal"; then
                echo "LOGIN API returns 500 - SCHEMA FIX FAILED!"
            else
                echo "LOGIN API response: $LOGIN_RESULT"
            fi
            
            # Test reviews (carousel data)
            REVIEWS=$(curl -sf http://127.0.0.1:8000/api/v1/reviews/ 2>&1) || true
            if echo "$REVIEWS" | grep -q '\['; then
                echo "REVIEWS API works: $(echo $REVIEWS | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))' 2>/dev/null || echo 'N/A') reviews"
            else
                echo "REVIEWS API FAILED: $REVIEWS"
            fi

            # Final health check — retry 3 times with 10s delay
            echo "=== FINAL HEALTH CHECK ==="
            HEALTH_OK=false
            for i in 1 2 3; do
                HEALTH_RESP=$(curl -sf http://127.0.0.1:8000/health 2>&1) || true
                if echo "$HEALTH_RESP" | grep -q '"status"'; then
                    HEALTH_OK=true
                    echo "Health check passed: $HEALTH_RESP"
                    break
                fi
                echo "Retry $i/3 — health check failed, waiting 10s..."
                sleep 10
            done

            if [ "$HEALTH_OK" = false ]; then
                echo "ERROR: Health check failed after 3 retries! Deployment may be unstable."
            else
                echo "=== DEPLOYMENT SUCCESSFUL ==="
            fi

