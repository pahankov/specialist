name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: |
            DATABASE_URL
          script: |
            cd /var/www/beauty-specialist
            git config --global --add safe.directory /var/www/beauty-specialist
            git pull origin main
            git reset --hard HEAD

            # Export DATABASE_URL for migrations and scripts
            export DATABASE_URL="${DATABASE_URL}"

            # Write systemd service
            bash deploy_setup.sh

            # Backend
            cd online-booking/backend
            python3.12 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt

            # Run database migrations
            alembic upgrade head

            # Create/update superuser
            python3.12 create_superuser_sync.py

            # Seed production data if DB is empty
            python3.12 seed_production.py

            # Frontend
            cd ../frontend
            npm ci
            npm run build
            sudo cp -r dist/* /var/www/beauty-specialist/frontend/dist/

            # Restart
            sudo systemctl restart beauty-backend
            sudo systemctl restart nginx
