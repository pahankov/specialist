name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: |
            DATABASE_URL
          script: |
            set -ex

            echo "=========================================="
            echo " DEPLOY STARTED"
            echo "=========================================="

            cd /var/www/beauty-specialist

            # Fix permissions on entire project (GigaCode creates files with different perms)
            echo ">>> Fixing file permissions..."
            sudo chown -R deploy:deploy /var/www/beauty-specialist 2>/dev/null || true
            sudo chmod -R u+rw /var/www/beauty-specialist 2>/dev/null || true

            echo ">>> Pulling latest code..."
            git config --global --add safe.directory /var/www/beauty-specialist
            git pull origin main
            git reset --hard HEAD

            # Export DATABASE_URL for migrations and scripts
            export DATABASE_URL="${DATABASE_URL}"

            echo ">>> Writing systemd service..."
            bash deploy_setup.sh

            # Backend setup
            echo ">>> Setting up backend venv..."
            cd online-booking/backend
            python3.12 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt

            # Run database migrations
            echo ">>> Running alembic migrations..."
            alembic upgrade head

            # Create/update superuser
            echo ">>> Creating/updating superuser..."
            python3.12 create_superuser.py

            # Fix any database issues
            echo ">>> Fixing production DB..."
            python3.12 fix_production_db.py

            # Seed production data
            echo ">>> Seeding production data..."
            python3.12 seed_production.py

            # Create minimal data for reviews carousel
            echo ">>> Creating minimal data for reviews..."
            python3.12 create_minimal_reviews.py

            # Frontend
            echo ">>> Building frontend..."
            cd ../frontend
            npm ci
            npm run build
            sudo cp -r dist/* /var/www/beauty-specialist/frontend/dist/

            # Restart services
            echo ">>> Restarting services..."
            sudo systemctl restart beauty-backend
            sudo systemctl restart nginx

            echo "=========================================="
            echo " DEPLOY SUCCESSFUL"
            echo "=========================================="
