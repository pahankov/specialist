name: Deploy

on:
  push:
    branches: [main]

# Never cancel a deploy halfway through: migrations and service restarts are
# not idempotent-safe to interrupt. A newer push queues behind the current run.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RATE_LIMIT_DISABLED: "true"
      # Test-only JWT secrets (.env is gitignored by design; fail-closed
      # validation requires >= 32 chars even outside production).
      SECRET_KEY: "ci-test-secret-key-not-for-production-01"
      REFRESH_SECRET_KEY: "ci-test-refresh-key-not-for-production-01"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd online-booking/backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite

      - name: Run tests
        # PIPESTATUS is mandatory: without it the pipeline exits with tee's
        # status, so the deploy proceeds even when pytest failed — which is
        # exactly how six red CI runs (20.10.2026) still reached production.
        run: |
          cd online-booking/backend
          set +e
          PYTHONPATH=. pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --tb=no 2>&1 | tee test-results.txt
          status=${PIPESTATUS[0]}
          echo ""
          echo "=== TEST SUMMARY ==="
          # Only match the final summary line: "X passed, Y failed, ..."
          grep -E "^[=]+.*passed.*failed" test-results.txt | tail -1 || \
          grep "passed.*in" test-results.txt | tail -1
          exit "$status"

  frontend:
    # Deploy must not ship a frontend that CI would reject. ci.yml runs on the
    # same push, but `needs` cannot reference another workflow, so the full
    # frontend gate is duplicated here (the root cause of run 39941588402:
    # untracked src/lib files compiled locally but were missing in prod).
    name: Frontend Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: online-booking/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd online-booking/frontend
          npm ci

      - name: Run ESLint
        run: |
          cd online-booking/frontend
          npx eslint src/

      - name: Check formatting
        run: |
          cd online-booking/frontend
          npx prettier --check src/

      - name: Type check
        run: |
          cd online-booking/frontend
          npx tsc --noEmit

      - name: Run Vitest
        run: |
          cd online-booking/frontend
          npx vitest run

      - name: Build frontend
        run: |
          cd online-booking/frontend
          npm run build

  deploy:
    # `needs` can only reference jobs from THIS workflow. The PostgreSQL job
    # lives in ci.yml and runs on the same push, but cannot gate this job.
    needs: [test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        env:
          # `envs` below can only forward variables that exist in this step's
          # environment; without this mapping the secret was silently ignored.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: |
            DATABASE_URL
          script_stop: true
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e
            set -o pipefail
            cd /var/www/beauty-specialist

            # Fix permissions
            sudo chown -R deploy:deploy /var/www/beauty-specialist 2>/dev/null || true
            sudo chmod -R u+rw /var/www/beauty-specialist 2>/dev/null || true

            git config --global --add safe.directory /var/www/beauty-specialist

            # Best-effort: unban home IP (banned after manual SSH retries).
            # GitHub runner IP is different, so this SSH still connects.
            sudo fail2ban-client set sshd unbanip 81.17.159.48 2>/dev/null || true

            # Fetch via GITHUB_TOKEN (runner IP is not fail2ban-banned,
            # no server-side git auth needed). Token is masked in logs.
            # Do NOT persist it in .git/config — fetch by URL.
            EXPECTED_SHA="${{ github.sha }}"
            echo "=== FETCH VIA TOKEN ==="
            if ! git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/pahankov/specialist.git" main; then
              echo "ERROR: token fetch failed. Check repo private + token permissions (contents=read)."
              exit 1
            fi
            if ! git cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null; then
              echo "ERROR: expected commit $EXPECTED_SHA was not fetched"
              exit 1
            fi
            # Deploy exactly the commit this workflow tested, not a newer
            # main tip that appeared while the run was queued.
            git reset --hard "$EXPECTED_SHA"
            git clean -fd
            ACTUAL_SHA=$(git rev-parse HEAD)
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "ERROR: deployed commit mismatch: $ACTUAL_SHA != $EXPECTED_SHA"
              exit 1
            fi

            # Verify deployed commit
            echo "=== DEPLOYED COMMIT ==="
            git log -1 --oneline
            echo "=== EXPECTED COMMIT ==="
            echo "$EXPECTED_SHA"
            echo "========================"

            # Resolve DATABASE_URL: GitHub Secret wins, else read ONLY that key
            # from the server .env. Never `source` the whole file in shell:
            # values with spaces (APP_NAME, PUBLIC_BASE_URL) would be executed
            # as commands and abort the deploy.
            ENV_FILE="$PWD/online-booking/backend/.env"
            if [ -z "${DATABASE_URL:-}" ] && [ -f "$ENV_FILE" ]; then
              echo "DATABASE_URL not set in env, reading it from server .env..."
              DATABASE_URL=$(sed -E -n 's/^[[:space:]]*(export[[:space:]]+)?DATABASE_URL[[:space:]]*=[[:space:]]*//p' "$ENV_FILE" | tail -n 1 | sed -e "s/^[\"']//" -e "s/[\"']$//")
            fi
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "ERROR: DATABASE_URL is empty and not found in $ENV_FILE"
              exit 1
            fi
            # Keep this a single command: appleboy/ssh-action with
            # script_stop injects an exit check after every line, and a
            # multi-line `case` puts it before the first pattern.
            if ! printf '%s' "$DATABASE_URL" | grep -q '^postgresql'; then echo "ERROR: DATABASE_URL must be a PostgreSQL URL"; exit 1; fi
            export DATABASE_URL
            echo "DATABASE_URL resolved: [masked]"

            # pg_dump does not understand SQLAlchemy driver suffixes.
            PG_URL=$(printf '%s' "$DATABASE_URL" | sed -E 's#^postgresql\+[a-z0-9_]+://#postgresql://#')

            # Alembic imports app.database and needs an async driver. The
            # GitHub Secret may be a plain postgresql:// URL for pg_dump,
            # so normalize it for every Python process below.
            DATABASE_URL=$(printf '%s' "$DATABASE_URL" | sed -E 's#^postgresql(\+[a-z0-9_]+)?://#postgresql+asyncpg://#')
            export DATABASE_URL

            # Backup database BEFORE any changes. A failed/empty backup must
            # stop the deploy: without it there is no rollback path.
            echo "=== DATABASE BACKUP ==="
            if ! command -v pg_dump >/dev/null 2>&1; then
              echo "ERROR: pg_dump is not installed; refusing to deploy without a backup"
              exit 1
            fi
            BACKUP_DIR=/var/backups/beauty-specialist
            BACKUP_FILE="$BACKUP_DIR/db-$(date +%Y%m%d-%H%M%S).sql"
            sudo mkdir -p "$BACKUP_DIR"
            if ! pg_dump "$PG_URL" | sudo tee "$BACKUP_FILE" >/dev/null; then
              echo "ERROR: pg_dump failed; deploy stopped"
              exit 1
            fi
            if ! sudo test -s "$BACKUP_FILE"; then
              echo "ERROR: backup file is empty: $BACKUP_FILE"
              exit 1
            fi
            sudo find "$BACKUP_DIR" -name 'db-*.sql' -type f -mtime +14 -delete || true
            echo "Backup written: $BACKUP_FILE"
            echo "=== BACKUP DONE ==="

            # Ensure deploy scripts exist (may have Windows line endings)
            if [ ! -f scripts/deploy_setup.sh ]; then
                echo "ERROR: scripts/deploy_setup.sh not found!"
                ls -la
                exit 1
            fi
            sed -i 's/\r$//' scripts/deploy_setup.sh
            bash scripts/deploy_setup.sh

            # Backend
            cd online-booking/backend
            python3.12 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt

            # Tests are not re-run here anymore (removed in 1.78.1): the
            # GitHub Actions `test` job already gates this deploy via
            # `needs: test`, and the server-side run cost ~10 of ~13 minutes
            # on a 1 vCPU box.

            # Database stage: schema fix, ownership, alembic, seed scripts.
            # Lives in scripts/deploy_db.sh (absolute path, LF via .gitattributes).
            bash /var/www/beauty-specialist/scripts/deploy_db.sh /var/www/beauty-specialist

            # Frontend stage: clean, build, integrity checks, copy with verification.
            # Lives in scripts/deploy_frontend.sh (absolute path, LF via .gitattributes).
            bash /var/www/beauty-specialist/scripts/deploy_frontend.sh /var/www/beauty-specialist
            
            # Finalize stage: permissions, nginx, restart, health checks.
            # Lives in scripts/deploy_finalize.sh (absolute path, LF via .gitattributes).
            bash /var/www/beauty-specialist/scripts/deploy_finalize.sh /var/www/beauty-specialist
