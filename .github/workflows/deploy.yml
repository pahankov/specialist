name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: |
            DATABASE_URL
          script: |
            cd /var/www/beauty-specialist
            git config --global --add safe.directory /var/www/beauty-specialist
            git pull origin main
            git reset --hard HEAD

            # Write systemd service with DATABASE_URL
            cat > /etc/systemd/system/beauty-backend.service << 'EOF'
[Unit]
Description=Beauty Specialist Backend API
After=network.target postgresql.service

[Service]
Type=simple
User=www-data
WorkingDirectory=/var/www/beauty-specialist/online-booking/backend
Environment="PATH=/var/www/beauty-specialist/online-booking/backend/venv/bin"
Environment="DATABASE_URL=postgresql+asyncpg://specialist:REDACTED_DB_PASSWORD@localhost:5432/online_booking"
ExecStart=/var/www/beauty-specialist/online-booking/backend/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
Restart=always
RestartSec=5

[Install]
WantedBy=multi-user.target
EOF
            sudo systemctl daemon-reload

            # Backend
            cd online-booking/backend
            python3.12 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt

            # Run database migrations (alembic.ini has psycopg2 URL)
            alembic upgrade head

            # Create/update superuser (uses create_superuser_sync.py with psycopg2 URL)
            python3.12 create_superuser_sync.py

            # Seed production data if DB is empty
            python3.12 seed_production.py

            # Frontend
            cd ../frontend
            npm ci
            npm run build
            sudo cp -r dist/* /var/www/beauty-specialist/frontend/dist/

            # Restart
            sudo systemctl restart beauty-backend
            sudo systemctl restart nginx
