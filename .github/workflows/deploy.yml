name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: |
            DATABASE_URL
          script: |
            set -e
            cd /var/www/beauty-specialist

            # Fix git permissions (deploy user may not own .git after previous deploys)
            sudo chown -R deploy:deploy /var/www/beauty-specialist/.git 2>/dev/null || true
            sudo chmod -R u+rw /var/www/beauty-specialist/.git 2>/dev/null || true

            git config --global --add safe.directory /var/www/beauty-specialist
            git pull origin main
            git reset --hard HEAD

            # Export DATABASE_URL for migrations and scripts
            export DATABASE_URL="${DATABASE_URL}"

            # Write systemd service
            bash deploy_setup.sh

            # Backend
            cd online-booking/backend
            python3.12 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt

            # Run database migrations
            echo "=== ALEMBIC MIGRATIONS ==="
            alembic upgrade head 2>&1 | tee /tmp/deploy.log
            echo "" >> /tmp/deploy.log

            # Create/update superuser
            echo "=== CREATE SUPERUSER ==="
            python3.12 create_superuser.py 2>&1 | tee -a /tmp/deploy.log
            echo "" >> /tmp/deploy.log

            # Fix any database issues (geography, superuser profile)
            echo "=== FIX PRODUCTION DB ==="
            python3.12 fix_production_db.py 2>&1 | tee -a /tmp/deploy.log
            echo "" >> /tmp/deploy.log

            # Seed production data (geography + reviews)
            echo "=== SEED PRODUCTION ==="
            python3.12 seed_production.py 2>&1 | tee -a /tmp/deploy.log
            echo "" >> /tmp/deploy.log

            # Create minimal data for reviews carousel (masters, appointments, reviews)
            echo "=== CREATE MINIMAL REVIEWS ==="
            python3.12 create_minimal_reviews.py 2>&1 | tee -a /tmp/deploy.log
            echo "" >> /tmp/deploy.log

            # Frontend
            cd ../frontend
            npm ci
            npm run build
            sudo cp -r dist/* /var/www/beauty-specialist/frontend/dist/

            # Restart
            sudo systemctl restart beauty-backend
            sudo systemctl restart nginx

            # Show deploy log
            echo "=== DEPLOY LOG ==="
            cat /tmp/deploy.log
            echo "=== END LOG ==="
