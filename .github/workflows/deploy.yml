name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd online-booking/backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx aiosqlite

      - name: Run tests
        run: |
          cd online-booking/backend
          PYTHONPATH=. pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --tb=no 2>&1 | tee test-results.txt
          echo ""
          echo "=== TEST SUMMARY ==="
          # Only match the final summary line: "X passed, Y failed, ..."
          grep -E "^[=]+.*passed.*failed" test-results.txt | tail -1 || \
          grep "passed.*in" test-results.txt | tail -1

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: |
            DATABASE_URL
          script_stop: true
          timeout: 30m
          script: |
            cd /var/www/beauty-specialist

            # Fix permissions
            sudo chown -R deploy:deploy /var/www/beauty-specialist 2>/dev/null || true
            sudo chmod -R u+rw /var/www/beauty-specialist 2>/dev/null || true

            git config --global --add safe.directory /var/www/beauty-specialist
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Verify deployed commit
            echo "=== DEPLOYED COMMIT ==="
            git log -1 --oneline
            echo "=== EXPECTED COMMIT ==="
            echo "${{ github.sha }}"
            echo "========================"

            # Load DATABASE_URL from server-side .env (canonical, never committed) if env var is empty
            if [ -z "${DATABASE_URL}" ]; then
              echo "DATABASE_URL not set in env, reading from server .env file..."
              if [ -f online-booking/backend/.env ]; then
                export $(grep -v '^#' online-booking/backend/.env | xargs)
                echo "Loaded DATABASE_URL from server .env: [masked]"
              else
                echo "ERROR: DATABASE_URL is empty and no .env file found!"
                exit 1
              fi
            else
              echo "DATABASE_URL from GitHub Secrets: [masked]"
            fi

            # Backup database BEFORE any changes
            echo "=== DATABASE BACKUP ==="
            pg_dump "${DATABASE_URL}" > /tmp/db-backup-$(date +%Y%m%d-%H%M%S).sql 2>/dev/null || echo "[WARN] Backup skipped (pg_dump not available)"
            echo "=== BACKUP DONE ==="

            # Ensure deploy scripts exist (may have Windows line endings)
            if [ ! -f scripts/deploy_setup.sh ]; then
                echo "ERROR: scripts/deploy_setup.sh not found!"
                ls -la
                exit 1
            fi
            sed -i 's/\r$//' scripts/deploy_setup.sh
            bash scripts/deploy_setup.sh

            # Backend
            cd online-booking/backend
            python3.12 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt

            # Run tests BEFORE deployment
            echo "=== RUNNING TESTS ==="
            pip install pytest pytest-asyncio pytest-cov httpx aiosqlite
            PYTHONPATH=. pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --tb=no 2>&1 | tee /tmp/test-results.txt
            
            # Check for actual test failures (not coverage report lines)
            if grep -qE "^[=]+.*failed" /tmp/test-results.txt || grep -qE "^[=]+.*error" /tmp/test-results.txt; then
                echo "ERROR: Tests failed on server! Aborting deployment."
                grep -E "failed|error" /tmp/test-results.txt | tail -5
                exit 1
            fi
            
            # Show summary
            TEST_SUMMARY=$(grep "passed.*in" /tmp/test-results.txt | tail -1)
            echo "Test summary: $TEST_SUMMARY"
            echo "=== ALL TESTS PASSED ==="

            # Database stage: schema fix, ownership, alembic, seed scripts.
            # Lives in scripts/deploy_db.sh (absolute path, LF via .gitattributes).
            bash /var/www/beauty-specialist/scripts/deploy_db.sh /var/www/beauty-specialist

            # Frontend stage: clean, build, integrity checks, copy with verification.
            # Lives in scripts/deploy_frontend.sh (absolute path, LF via .gitattributes).
            bash /var/www/beauty-specialist/scripts/deploy_frontend.sh /var/www/beauty-specialist
            
            # Finalize stage: permissions, nginx, restart, health checks.
            # Lives in scripts/deploy_finalize.sh (absolute path, LF via .gitattributes).
            bash /var/www/beauty-specialist/scripts/deploy_finalize.sh /var/www/beauty-specialist
