name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push makes an in-flight CI run obsolete; deploy never uses this
# group, so cancellation here cannot interrupt production.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RATE_LIMIT_DISABLED: "true"
      # Test-only JWT secrets (.env is gitignored by design; fail-closed
      # validation requires >= 32 chars even outside production).
      SECRET_KEY: "ci-test-secret-key-not-for-production-01"
      REFRESH_SECRET_KEY: "ci-test-refresh-key-not-for-production-01"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd online-booking/backend
          pip install -r requirements.txt

      - name: Run tests with pytest
        # tee keeps the full log; PIPESTATUS keeps pytest's exit code. FAILED
        # lines are also echoed as check-run annotations: Actions log pages
        # require repo access, while annotations are visible to anyone.
        run: |
          cd online-booking/backend
          set +e
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=55 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== FAILED TESTS ==="
            grep -E "^(FAILED|ERROR) " pytest-output.txt | head -30 || true
            grep -E "^(FAILED|ERROR) " pytest-output.txt | head -20 | while IFS= read -r line; do
              echo "::error title=pytest::$line"
            done
          fi
          exit "$status"

      - name: Compile-check deploy scripts
        # seed_common.py shipped with an IndentationError once: tests never
        # import backend/*.py scripts, so only a syntax gate catches it.
        run: |
          cd online-booking/backend
          python -m py_compile seed_common.py seed_cities.py seed_test_data.py seed_production.py fix_production_db.py fix_production_masters.py create_minimal_reviews.py create_superuser.py pull_production.py backup_db.py restore_db.py max_poll.py max_webhook.py

      - name: ASCII-check start.ps1
        # powershell.exe 5.1 reads BOM-less scripts as ANSI: any multibyte
        # char breaks parsing and start.bat dies instantly with no message.
        # Scoped to start.ps1 (blind double-click entry point).
        run: |
          if grep -P '[^\x00-\x7F]' scripts/start.ps1; then
            echo "ERROR: non-ASCII bytes in scripts/start.ps1 (see above)"
            exit 1
          fi
          echo "start.ps1 is pure ASCII"

  backend-tests-postgres:
    name: Backend Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: online_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RATE_LIMIT_DISABLED: "true"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/online_booking_test"
      TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/online_booking_test"
      SECRET_KEY: "ci-test-secret-key-not-for-production-01"
      REFRESH_SECRET_KEY: "ci-test-refresh-key-not-for-production-01"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd online-booking/backend
          pip install -r requirements.txt

      - name: Run critical tests with PostgreSQL
        # These tests cover auth, services CRUD, and booking — the areas most
        # sensitive to PostgreSQL-specific behavior (types, constraints).
        # tee keeps the full log; PIPESTATUS keeps pytest's exit code.
        run: |
          cd online-booking/backend
          set +e
          python -m pytest tests/test_services.py tests/test_booking_auth.py tests/test_appointments.py tests/test_auth.py tests/test_auth_dependencies.py tests/test_otp_security.py -v --tb=short 2>&1 | tee pytest-pg-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "=== FAILED TESTS ==="
            grep -E "^(FAILED|ERROR) " pytest-pg-output.txt | head -30 || true
          fi
          exit "$status"

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: online-booking/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd online-booking/frontend
          npm ci

      - name: Run ESLint
        run: |
          cd online-booking/frontend
          npx eslint src/

      - name: Check formatting
        run: |
          cd online-booking/frontend
          npx prettier --check src/

      - name: Type check
        run: |
          cd online-booking/frontend
          npx tsc --noEmit

      - name: Run Vitest
        run: |
          cd online-booking/frontend
          npx vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-tests, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: online-booking/frontend/package-lock.json

      - name: Build frontend
        run: |
          cd online-booking/frontend
          npm ci
          npm run build
