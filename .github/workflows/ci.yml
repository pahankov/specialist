name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd online-booking/backend
          pip install -r requirements.txt

      - name: Run tests with pytest
        run: |
          cd online-booking/backend
          python -m pytest tests/ -v --tb=short

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: online-booking/frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd online-booking/frontend
          npm ci

      - name: Run ESLint
        run: |
          cd online-booking/frontend
          npx eslint src/

      - name: Type check
        run: |
          cd online-booking/frontend
          npx tsc --noEmit

      - name: Run Vitest
        run: |
          cd online-booking/frontend
          npx vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: online-booking/frontend/package-lock.json

      - name: Build frontend
        run: |
          cd online-booking/frontend
          npm ci
          npm run build
