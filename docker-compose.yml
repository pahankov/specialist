# Local dev compose (NOT production — prod runs on host systemd + nginx).
# Secrets: backend reads online-booking/backend/.env (single canon, gitignored).
# DB password below is a local-dev default; override via POSTGRES_PASSWORD env.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: online_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./online-booking/backend
    env_file: ./online-booking/backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./online-booking/backend:/app

  frontend:
    build: ./online-booking/frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./online-booking/frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data: